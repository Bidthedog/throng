<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- throng's crowd t, drawn on a 32px pixel grid so it stays sharp at 32px. -->
  <rect width="32" height="32" rx="7" fill="#000000" shape-rendering="geometricPrecision"/>
  <rect x="10" y="2" width="4" height="4" fill="#2bb3a3"/>
  <rect x="10" y="6" width="4" height="4" fill="#8a7cf0"/>
  <rect x="6" y="10" width="4" height="4" fill="#2bb3a3"/>
  <rect x="10" y="10" width="4" height="4" fill="#f2a93b"/>
  <rect x="14" y="10" width="4" height="4" fill="#8a7cf0"/>
  <rect x="18" y="10" width="4" height="4" fill="#f2665e"/>
  <rect x="10" y="14" width="4" height="4" fill="#f2a93b"/>
  <rect x="10" y="18" width="4" height="4" fill="#f2665e"/>
  <rect x="10" y="22" width="4" height="4" fill="#f2a93b"/>
  <rect x="22" y="22" width="4" height="4" fill="#8a7cf0"/>
  <rect x="14" y="26" width="4" height="4" fill="#2bb3a3"/>
  <rect x="18" y="26" width="4" height="4" fill="#f2a93b"/>
</svg>
