<!doctype html>

    <!-- specs/044-file-previews/contracts/security-policy.md Layer 3, pinned by
         tests/unit/renderer-csp.test.ts. style-src keeps 'unsafe-inline' because CodeMirror and the
         theme provider mount <style> elements; connect-src, font-src and media-src stay on
         default-src. Must precede every script and stylesheet it governs. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: throng-preview:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>throng</title>
  </head>
  <body>
    <!-- React mount point. The two-Pane docking shell is rendered here
         (composition-root.tsx → app.tsx). -->
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
