<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- specs/044-file-previews/contracts/security-policy.md Layer 3, pinned by
         tests/unit/renderer-csp.test.ts. style-src keeps 'unsafe-inline' because CodeMirror and the
         theme provider mount <style> elements, and admits the preview asset route because the HTML
         preview's srcdoc frame inherits this policy and loads the page's own stylesheets from it (074
         FR-072, FR-092). font-src admits the same route and https: for that page's fonts, which a safe
         source may name (074 FR-092a); connect-src and media-src stay on default-src. frame-src admits only
         the HTML preview's follow route, which answers 204 and serves no document (074 FR-092, research
         R6). Must precede every script and stylesheet it governs. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' throng-preview://asset https:; font-src 'self' throng-preview: https:; img-src 'self' https: throng-preview: blob:; object-src 'none'; frame-src throng-preview://follow; base-uri 'none'; form-action 'none'"
    />
    <title>throng</title>
  </head>
  <body>
    <!-- React mount point. The two-Pane docking shell is rendered here
         (composition-root.tsx → app.tsx). -->
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
