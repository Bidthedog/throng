name: Fail fast, cancel the run
description: Cancel the whole workflow run, because a job of a fail-fast run failed, timed out or was cancelled (072 FR-019).

# GitHub Actions has no cross-job fail-fast, so every pipeline job ends with a step that uses this action, gated on
# `(failure() || cancelled()) && needs.plan.outputs.fail_fast == 'true'`. The `cancelled()` half is what catches a job that
# hit its timeout-minutes: such a job is cancelled, not failed, and a step gated on failure() alone never runs in it.
#
# `gh` is preferred; the Fedora containers the verification jobs use have none, so the step falls back to the REST call it
# wraps. In a called workflow GITHUB_RUN_ID is the CALLER's run, so a release run is cancelled whole and nothing publishes.
#
# Cancelling a run that is already being cancelled is not an error worth failing a job for: a job cancelled BECAUSE the run
# was cancelled reaches this step too, so a refusal here is only a warning.

inputs:
  token:
    description: A token with actions:write on this repository (github.token, with the job's permissions).
    required: true

runs:
  using: composite
  steps:
    - name: Cancel the run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        gh run cancel "$GITHUB_RUN_ID" ||
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" ||
          echo "::warning::could not cancel run $GITHUB_RUN_ID (already cancelling, or no permission)"
