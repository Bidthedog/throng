name: Release

# Packaging, clean-machine installer verification, and gated GitHub-Releases publish for throng
# (feature 020, #21). Windows-only (FR-038), windows-2022 + Node 20 to match CI's native builds so
# the bundled runtime's ABI matches the daemon's native modules (better-sqlite3, node-pty, koffi).
#
# - build-installer + verify-installer run on every push to the packaging branch and on demand, so
#   the installer is actually built and CLEAN-INSTALLED on a fresh runner (the closest thing to a
#   clean machine for a GUI app — the runner has a virtual desktop the Electron app needs).
# - publish runs only for a version tag or an explicit dispatch, and is gated on the `release`
#   Environment's required reviewers (the human QA sign-off, FR-029) — it cannot be triggered from a
#   developer machine or an unreviewed branch (FR-037).

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release (requires the release Environment approval)'
        type: boolean
        default: false
  push:
    # `master` rather than a long-dead feature branch. This said `worktree-21-app-packaging` — the
    # branch feature 020 was built on, merged and deleted long ago — so the packaging path had not
    # been exercised by a push in months and nobody noticed, because a trigger that never fires
    # looks exactly like a trigger whose job always passes.
    branches: [master]
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  npm_config_loglevel: error

jobs:
  # THE FULL E2E SUITE, and this is the only place it runs (034 FR-056, constitution v5.0.0).
  #
  # CI gates every push on the `@core` lane — 35 critical journeys, single digit minutes. That is a
  # deliberately smaller net, and this job is the other half of the trade: everything tagged
  # `@extended` runs here, once, before an installer is built. Without it the reduced CI surface
  # would not be a reduction, it would be a hole.
  #
  # It GATES rather than reports. `build-installer` needs it, so a red suite means no artifact —
  # the distinction 034 insisted on, because a release-time signal nobody blocks on is a signal
  # nobody reads.
  #
  # One job, no shards, one worker: the same arithmetic that removed sharding from CI (FR-057). This
  # lane is not on anyone's critical path, so trading wall-clock for runner-minutes is the right way
  # round here even more clearly than there.
  e2e-full:
    name: E2E (full suite)
    runs-on: windows-2022
    # The full suite measured 21.2 minutes locally at 229 spec files / 641 declarations, on the
    # baseline machine at `53ff359` (2026-08-18) — two tiers, parallel 2.7 and serial 18.5. This job
    # runs ONE worker rather than two tiers, so it is slower than that figure by design and slower
    # again on a runner; 90 is a hang detector with headroom, not a budget to grow into.
    timeout-minutes: 90
    env:
      THRONG_E2E_WORKERS: 1
      THRONG_E2E_RETRIES: 3
      THRONG_E2E_JSON_OUT: e2e-report.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Alias-free temp dir — the runner's default %TEMP% carries an 8.3 short name
      # (C:\Users\RUNNER~1\...) that breaks in-tree path matching in some file specs. Same reason
      # as ci.yml; not usable via `runner.temp` in a job-level `env`.
      - name: Use an alias-free temp dir
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$env:RUNNER_TEMP"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install dependencies
        run: npm ci
      # The runner's virtual desktop defaults to 1024x768, which is too small for the window the
      # app opens; several specs assert layout that only holds at a realistic size.
      - name: Set screen resolution to 1920x1080
        shell: pwsh
        run: ./scripts/ci-set-resolution.ps1
      - name: Run the full E2E suite (flake-policy aware)
        shell: pwsh
        # No -Grep: everything except what grepInvert excludes (@admin, @quarantine). @admin has its
        # own elevated job in ci.yml and is not duplicated here.
        run: ./scripts/ci-e2e-run.ps1
      - name: Upload traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-e2e-full
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  build-installer:
    name: Build the per-user installer
    needs: e2e-full
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Read product version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Package (build + stage runtime + electron-builder NSIS per-user)
        run: npm run package -- --publish never
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: throng-installer
          path: dist/installer/*.exe
          if-no-files-found: error
          # The installer is ~131 MB and this artifact is only a hand-off between the three jobs
          # below; the bytes anyone actually wants are the ones `publish` attaches to the GitHub
          # Release, which does not expire. At the 90-day default, seventeen superseded builds from
          # one afternoon of packaging iteration sat in Actions storage until mid-October.
          #
          # It cannot go to 1 day. `publish` is gated on the release Environment's required
          # reviewers, so the artifact has to outlive however long the human takes to approve —
          # expire it first and the gated job fails at download-artifact, having passed every check.
          # Five days is the approval window, not a storage target.
          retention-days: 5

  verify-installer:
    name: Verify on a clean machine
    runs-on: windows-2022
    timeout-minutes: 30
    needs: build-installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (@throng/core for the verify harness)
        run: npm run build
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: throng-installer
          path: dist/installer
      - name: Verify install -> launch -> version -> uninstall -> residue
        shell: bash
        run: |
          installer=$(ls dist/installer/*.exe | head -n1)
          echo "Verifying $installer"
          node scripts/verify-installer.mjs "$installer" \
            --expected-version "${{ needs.build-installer.outputs.version }}" \
            --verdict-out verification-verdict.json
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-verdict
          path: verification-verdict.json
          if-no-files-found: warn
          # `publish` downloads this too, so it expires with the installer above rather than
          # outliving it — a verdict without its build is a gate failure that reads like a bug.
          retention-days: 5

  publish:
    name: Publish GitHub Release (gated)
    runs-on: windows-2022
    timeout-minutes: 20
    needs: [build-installer, verify-installer]
    # Only for a version tag or an explicit dispatch with publish=true. The Environment's required
    # reviewers are the human QA sign-off (FR-029); approval gates this job's run.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (@throng/core for the gate + checksum)
        run: npm run build
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: throng-installer
          path: dist/installer
      - name: Download verdict
        uses: actions/download-artifact@v4
        with:
          name: verification-verdict
          path: .
      - name: Evaluate publish gates (real version + verified + signed off; refuse re-publish)
        shell: bash
        env:
          THRONG_VERDICT_FILE: verification-verdict.json
          THRONG_QA_SIGNED_OFF: '1' # the release Environment approval gates this job's run
          # The release tag this run publishes — the sign-off/version binding (T041a/T038a): the gate
          # refuses unless the installer filename, package version, verdict-reported version and this
          # tag all agree, so an approval cannot satisfy the gate for a different build.
          THRONG_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          installer=$(ls dist/installer/*.exe | head -n1)
          export THRONG_INSTALLER_FILE="$installer"
          version="${{ needs.build-installer.outputs.version }}"
          if gh release view "v$version" >/dev/null 2>&1; then export THRONG_ALREADY_PUBLISHED=1; fi
          node scripts/publish-gates.mjs
        # gh is preinstalled on the runner; GH_TOKEN provided below.
      - name: Compute checksum (last step reading the bytes) and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          installer=$(ls dist/installer/*.exe | head -n1)
          version="${{ needs.build-installer.outputs.version }}"
          sum=$(node scripts/checksum.mjs "$installer")
          # A SemVer prerelease suffix (1.0.0-alpha1, 1.0.0-rc.2) publishes as a GitHub PRERELEASE, so an
          # alpha never becomes the repository's "latest release" that the install docs point people at.
          prerelease=''
          case "$version" in *-*) prerelease='--prerelease';; esac
          notes="Automated release of throng v$version.

          **This installer is not code-signed.** Windows will show an \"unrecognised app\" warning
          (SmartScreen) — click **More info → Run anyway**. Never disable a security feature to install.
          Verify your download matches the checksum below (\`Get-FileHash <file> -Algorithm SHA256\`).

          | Artifact | SHA-256 |
          |---|---|
          | $(basename "$installer") | \`$(echo "$sum" | cut -d' ' -f1)\` |

          Built from ${{ github.sha }}."
          gh release create "v$version" "$installer" --title "throng v$version" --notes "$notes" $prerelease
