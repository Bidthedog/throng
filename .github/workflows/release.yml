name: Release

# A release runs only on a pushed `v*` tag (072 FR-022, FR-025). It runs the FULL pipeline on the tagged tree first
# (pipeline.yml, called, fail-fast), and publishes only when that has passed:
#
#   on-master ──▶ pipeline (every test of every layer on every platform, every artifact built and verified)
#                    └─▶ sign-index ──▶ publish ──▶ deploy-repositories
#
# - THE PIPELINE'S JOBS RUN INSIDE THIS RUN, so the artifacts it builds and the verdicts it writes are downloadable here
#   with no hand-off between runs (FR-023): publication uses exactly the bytes that were built and verified. The packaging
#   and verification jobs, the render-body gate and the shape of the artifact set are pipeline.yml's, and so are the
#   comments explaining them.
# - There is no rehearsal here: nothing runs on a branch push or a dispatch, and no input skips or reuses the pipeline. A
#   rehearsal is a `pipeline.yml` dispatch, which publishes nothing.
# - publish and sign-index run for a `v*` tag only, and nobody approves them (065 FR-001, FR-002): a release that passes
#   every machine gate publishes unattended. What stands in for the human review is that the tagged commit must already be
#   on master, so it reached master through a PR and its required checks (065 FR-003, 020 FR-037), and the `release`
#   Environment accepts only `v*` tags, so no branch run can read its secrets.
# - A step the hosted runner cannot exercise is recorded `unproven` with its reason and is listed in the job summary and the
#   release body; it never counts as a pass (058 spec Assumptions).
#
# RECOVERY (contracts/release-run.md). An infrastructure fault only: `gh run rerun <run> --failed`, once, on the same tag.
# A test or build failure with nothing published: `node scripts/release-discard.mjs v<version>`, `git tag -d v<version>`,
# fix it through its own PR, and re-tag the same version on master. A published release is never touched: cut the next one.

on:
  push:
    tags: ['v*']

# Re-pushing a tag for the same version cancels its in-progress run (FR-026). The called pipeline keys its own group by its
# run id, so the two never share this one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  npm_config_loglevel: error

jobs:
  # FR-024: the tagged commit must be on master BEFORE the pipeline spends an hour of runners on it. sign-index and publish
  # check it again, immediately before they read a secret or create the release.
  on-master:
    name: Tag is on master
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Refuse a tag whose commit is not on master
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on master. Tag the merged release commit."
            exit 1
          fi

  # The full pipeline, called: full, fail-fast, dispatch inputs ignored. No secret is passed on: it publishes nothing and
  # needs none. The permissions are the most its jobs request (a called workflow cannot exceed its caller's): `actions:
  # write` for the fail-fast cancel, `issues: write` for the report job, which a tag run skips.
  pipeline:
    name: Full pipeline
    needs: on-master
    uses: ./.github/workflows/pipeline.yml
    permissions:
      actions: write
      contents: read
      issues: write

  # SIGN THE INDEXES (064 FR-006, FR-009). The only job that can read the private key, because the key is a `release`
  # Environment secret. It runs before publish, which attaches the bundle it makes (#571), and it is on Linux so publish's
  # Windows runner stays as it was. Signing changes no repository: only deploy-repositories does, and that needs publish.
  # Nobody approves it (065 FR-001); it makes the on-master check before the key is read (065 FR-003).
  sign-index:
    name: Sign the repository indexes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [on-master, pipeline]
    # Every need named, with its own result: the implicit success() is false when ANY upstream job was skipped, and alpha16's
    # first tag skipped all three publishing jobs behind a skipped E2E job.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.on-master.result == 'success' && needs.pipeline.result == 'success' }}
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Refuse a tag whose commit is not on master
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on master. Tag the merged release commit."
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install createrepo_c
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends createrepo-c
      - name: Install the harness (no native builds)
        run: npm ci --ignore-scripts
      - name: Build @throng/core to resolve the artifacts
        run: npx tsc -b packages/core
      - name: Download the .deb
        uses: actions/download-artifact@v7
        with:
          name: throng-deb
          path: dist/installer
      - name: Download the .rpm
        uses: actions/download-artifact@v7
        with:
          name: throng-rpm
          path: dist/installer
      - name: Build, sign and bundle the indexes
        shell: bash
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$REPO_SIGNING_KEY" ]; then
            echo "::error::REPO_SIGNING_KEY is not set on the release Environment. See docs/releasing.md."
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          trap 'gpgconf --kill all; rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$REPO_SIGNING_KEY" | gpg --batch --quiet --import
          node scripts/package-repo.mjs build --version "$version" --out repo-index \
            --deb "$(node scripts/artifact-set.mjs resolve deb)" \
            --rpm "$(node scripts/artifact-set.mjs resolve rpm)"
          node scripts/package-repo.mjs sign --dir repo-index
          node scripts/package-repo.mjs bundle --dir repo-index --version "$version" --out repo-bundle
      # Its name does not start with `throng-`, so the jobs that collect the release's artifacts never see it.
      - name: Upload the bundle
        uses: actions/upload-artifact@v6
        with:
          name: repo-index-bundle
          path: repo-bundle/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    runs-on: windows-2022
    timeout-minutes: 20
    needs: [on-master, pipeline, sign-index]
    # The same condition as sign-index's, also naming the signing it needs.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.on-master.result == 'success' && needs.pipeline.result == 'success' && needs.sign-index.result == 'success' }}
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # 065 FR-003: what stands in for the human review is that the tagged commit reached master through a PR and its
      # required checks. A tag pushed on a branch commit is refused before anything is read or created.
      - name: Refuse a tag whose commit is not on master
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on master. Tag the merged release commit."
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (@throng/core for the gate + checksum)
        run: npm run build
      # The pipeline's artifacts are this run's own: nothing crosses runs.
      - name: Download the artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: throng-*
          merge-multiple: true
          path: dist/installer
      - name: Download every verdict
        uses: actions/download-artifact@v7
        with:
          pattern: verdict-*
          merge-multiple: true
          path: .
      # 064 FR-006, #571: the signed bundle goes into the release as it is created. The repository has immutable releases
      # on, so nothing can be attached once the release is out.
      - name: Download the signed repository bundle
        uses: actions/download-artifact@v7
        with:
          name: repo-index-bundle
          path: repo-bundle
      - name: Evaluate publish gates (real version + set reconciles + every combination verified + notes)
        shell: bash
        env:
          # The release tag this run publishes: the gate refuses unless the installer filename, package version,
          # verdict-reported version and this tag all agree, so a tag cannot publish a different build.
          THRONG_RELEASE_TAG: ${{ github.ref_name }}
          THRONG_GAPS_OUT: verification-gaps.json
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if gh release view "v$version" >/dev/null 2>&1; then export THRONG_ALREADY_PUBLISHED=1; fi
          # 058 FR-030: one verdict per verification COMBINATION plus the coexistence verdict, DERIVED from the declaration.
          THRONG_VERDICT_FILES="$(node scripts/artifact-set.mjs list --combinations | cut -f4 | paste -sd, -),verification-verdict-coexistence.json"
          export THRONG_VERDICT_FILES
          node scripts/publish-gates.mjs
      - name: Compute checksums (last step reading the bytes), compose the body, and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          # 020 FR-042a: each digest is computed from the exact published bytes, here, as the last step that reads them.
          artifacts=$(node scripts/artifact-set.mjs checksums)
          # 042 FR-001/FR-007: the body is COMPOSED from CHANGELOG.md and the invariant footer, never authored here.
          node scripts/release-notes.mjs render \
            --version "$version" \
            --artifacts "$artifacts" \
            --gaps "$(cat verification-gaps.json)" \
            --sha "${{ github.sha }}" \
            --out release-body.md
          # A SemVer prerelease suffix (1.0.0-alpha1, 1.0.0-rc.2) publishes as a GitHub PRERELEASE, so an alpha never
          # becomes the repository's "latest release" that the install docs point people at.
          prerelease=''
          case "$version" in *-*) prerelease='--prerelease';; esac
          # Every artifact of the declared set is attached: named, not globbed (042 FR-017).
          mapfile -t files < <(node scripts/artifact-set.mjs list --paths)
          # The signed repository bundle rides along. It is not a declared artifact, so it has no checksum row: its indexes
          # are signed instead (064 FR-006, FR-009).
          bundle="repo-bundle/throng-repo-index-$version.tar.gz"
          test -f "$bundle" || { echo "::error::$bundle is missing"; exit 1; }
          gh release create "v$version" "${files[@]}" "$bundle" \
            --title "throng v$version" --notes-file release-body.md $prerelease

  # UPDATE THE REPOSITORIES (064 FR-010). Only once the release is out. It holds no key and touches no release: the signed
  # bundle is already attached, and the Pages deployment reads it back from the release. A failure here leaves the
  # repositories on the previous version, and re-running this job repairs it.
  deploy-repositories:
    name: Update the package repositories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # On master, because the github-pages Environment does not accept a tag (research D4).
      - name: Deploy the site
        run: gh workflow run pages.yml --ref master
