name: CI

# PR CI (072): a verdict on a pull request in minutes. It runs on every pull request to master, draft or ready, on Linux
# only, and it runs no end-to-end test. The slow proof (every test of every layer on every platform, every artifact built
# and verified) is pipeline.yml's, nightly and on demand, and again inside every release run.
#
# It runs on nothing else: no push, no dispatch, no schedule. A merge to master is not re-tested, because the pull
# request's run on its head commit already tested that tree and the merge needs that run green.
#
# NO JOB FAILS FAST (FR-002). A failing job never cancels the others, so one run shows every red there is. The one required
# check on master is `CI verdict` (FR-004): jobs can be renamed or split without touching branch protection again.
#
# This repository is PUBLIC and a pull request may come from a fork. These jobs read no secret, write nothing and run on
# GitHub-hosted runners only; that is what makes a `pull_request` trigger safe here, and it must stay true of every job
# added to this file.
#
# A PULL REQUEST NO JOB CAN FAIL ON SKIPS THE WORK (FR-004a). When every file it changes is one no job reads (the
# constitution, specs, manual test plans: scripts/ci-changes.mjs holds the list), the work jobs skip and the verdict passes
# on the change check's answer. A path nobody declared inert runs everything.
#
# packages/ui/tests/unit/ci-workflow.test.ts holds the shape above.

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

# A newer push to the same pull request cancels its older run.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # node-gyp builds (node-pty) are noisy; keep logs terse.
  npm_config_loglevel: error

jobs:
  # FR-004a: does any changed file reach a job? The merge commit's first parent is the base it lands on, so the diff is the
  # pull request's own change against the base it would merge into. Node is on the runner image; the script needs no install.
  changes:
    name: Changed inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Decide whether any job reads a changed file
        id: decide
        run: |
          set -euo pipefail
          git diff --name-only HEAD^1 HEAD | node scripts/ci-changes.mjs >> "$GITHUB_OUTPUT"

  lint:
    name: Lint & type-check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript type-check
        run: npm run typecheck

  # Ubuntu 24.04 restricts the user namespaces Electron's sandbox needs, as a developer's machine does, and
  # ci-linux-setup.sh takes the same one step a developer takes. The sandbox stays on throughout (062 FR-003).
  unit:
    name: Unit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Prepare the runner
        run: sudo scripts/ci-linux-setup.sh
      - name: Install dependencies
        run: npm ci
      - name: Install Electron's binary
        uses: ./.github/actions/install-electron
      - name: Unit tests
        run: npm run test:unit

  component:
    name: Component (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # Each shard's result is wanted even when the other fails.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Prepare the runner
        run: sudo scripts/ci-linux-setup.sh
      - name: Install dependencies
        run: npm ci
      - name: Install Electron's binary
        uses: ./.github/actions/install-electron
      - name: Component tests
        run: npm run test:component -- --shard=${{ matrix.shard }}/2

  # Contract tests spawn the REAL daemon (`node packages/daemon/dist/main.js`) and read its dist/BUILD_ID, so the daemon is
  # built first: on a clean checkout there is no dist/.
  contract:
    name: Contract
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Prepare the runner
        run: sudo scripts/ci-linux-setup.sh
      - name: Install dependencies
        run: npm ci
      - name: Install Electron's binary
        uses: ./.github/actions/install-electron
      - name: Build (daemon dist + BUILD_ID)
        run: npm run build
      - name: Contract tests
        run: npm run test:contract

  # The critical-path subset only (FR-008): the integration files tagged `critical-path`, at most fifteen, one per
  # subsystem. The rest of integration runs in pipeline.yml. No build: every tagged file imports from source and none
  # spawns the built daemon (research R6).
  #
  # The files are named on the command line, because `--tags-filter` alone makes vitest import all of integration's files to
  # read their tags, which costs about a minute and a half. A tag that matches nothing leaves an empty list, and the step
  # fails on that instead of falling back to every file.
  integration:
    name: Integration (critical path)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Prepare the runner
        run: sudo scripts/ci-linux-setup.sh
      - name: Install dependencies
        run: npm ci
      - name: Install Electron's binary
        uses: ./.github/actions/install-electron
      - name: Integration tests (critical path)
        run: |
          set -euo pipefail
          mapfile -t files < <(grep -rlE "tags: \[[^]]*'critical-path'" packages/*/tests/integration)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no integration file is tagged critical-path"
            exit 1
          fi
          npx vitest run --project integration --tags-filter=critical-path "${files[@]}"

  # THE ONE REQUIRED CHECK (FR-004). It runs whatever the others did, and passes only when every one of them succeeded: a
  # failed, a cancelled or a skipped job all fail it. The one exception is FR-004a's: the change check succeeded and found no
  # changed file any job reads, so the work jobs were skipped on purpose.
  verdict:
    name: CI verdict
    needs: [changes, lint, unit, component, contract, integration]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          if [ "$(jq -r '.changes.result' <<<"$NEEDS")" = success ] && [ "$(jq -r '.changes.outputs.code' <<<"$NEEDS")" = false ]; then
            echo "No changed file is one any job reads (FR-004a); nothing to run."
            exit 0
          fi
          bad=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<<"$NEEDS")
          if [ -n "$bad" ]; then
            echo "::error::not green: $bad"
            exit 1
          fi
          echo "Every job succeeded."
